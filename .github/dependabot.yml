# Weekly pull requests for dependency and base-image updates (security fixes arrive the same way).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
