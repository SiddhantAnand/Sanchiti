name: CI/CD

# Every push/PR: backend tests against Postgres + web type-check and build.
# Push to main (after both pass): publish Docker images to GHCR, then call the host's deploy hooks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ExpenseTracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -q test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sanchiti-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app == 'api' && './backend' || './web' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      # Repository secrets DEPLOY_HOOK_API / DEPLOY_HOOK_WEB: the host's "deploy hook" URLs (Render, Northflank, ...).
      - name: Trigger deploy hooks
        env:
          API_HOOK: ${{ secrets.DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$API_HOOK$WEB_HOOK" ]; then
            echo "::notice::No deploy hooks set; images were published to GHCR only."
            exit 0
          fi
          if [ -n "$API_HOOK" ]; then curl -fsS -X POST "$API_HOOK" -o /dev/null && echo "API deploy triggered"; fi
          if [ -n "$WEB_HOOK" ]; then curl -fsS -X POST "$WEB_HOOK" -o /dev/null && echo "Web deploy triggered"; fi
