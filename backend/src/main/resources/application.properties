spring.application.name=sanchiti
# Local runs only: KEY=value file next to pom.xml (never commit it). Containers get real environment variables.
spring.config.import=optional:file:.env[.properties]

server.address=${HOST:127.0.0.1}
server.port=${PORT:8787}
# Behind a proxy/load balancer: honour X-Forwarded-Proto/For from private-network proxies only.
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ExpenseTracker}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mvc.problemdetails.enabled=false

# First (admin) account, created on the first start. Later password/phone-key changes are made in Settings and
# these values are then ignored. API_TOKEN becomes this account's phone key (Bearer token for the iPhone Shortcut).
app.owner.login=${APP_LOGIN:admin}
app.owner.name=${APP_USER:Owner}
app.owner.password=${APP_PASSWORD:}
app.owner.phone-key=${API_TOKEN:}
app.timezone=${TIMEZONE:Asia/Kolkata}
# true when served over HTTPS: the sign-in cookie is then never sent over plain HTTP.
app.secure-cookies=${SECURE_COOKIES:false}
app.categorize-on-ingest=${CATEGORIZE_ON_INGEST:true}
app.auto-weekly=${AUTO_WEEKLY:true}
app.known-banks=${KNOWN_BANKS:HDFC Bank,SBM Bank India,ICICI Bank,State Bank of India|SBI,Bank of India|BOI,Indian Bank}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
